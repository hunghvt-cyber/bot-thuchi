name: Deploy Apps Script
on:
  # Production uses the existing polling trigger; deploy code without bootstrap.
  push:
    branches: [main]
    paths: ["*.gs", "appsscript.json", "tests/**", ".github/workflows/deploy-apps-script.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: apps-script-production
  cancel-in-progress: true
jobs:
  test-and-deploy:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[deploy-gemini]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Test money parser
        run: node tests/test-money-parser.js
      - name: Test reporting and Gemini features
        run: node --test tests/*.test.js
      - name: Restore clasp credentials
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          if [ -z "$CLASPRC_JSON" ]; then
            echo "::error::Missing GitHub Actions secret CLASPRC_JSON"
            exit 1
          fi
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          chmod 600 "$HOME/.clasprc.json"
      - name: Push source to Apps Script
        run: npx --yes @google/clasp@3.4.1 push --force
      - name: Redeploy Web App
        run: npx --yes @google/clasp@3.4.1 update-deployment "AKfycbyaTgOIeeNkUEUoqsQcEaI_LPSFh8V4Rf28gxXppiTWCpxM8Eirm-wsQH_JMV9kmXyh" --description "GitHub ${GITHUB_SHA}"
      # Legacy bootstrap deliberately disabled: it re-creates the polling trigger.

