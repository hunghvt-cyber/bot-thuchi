name: Deploy Apps Script
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: apps-script-production
  cancel-in-progress: true
jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Test money parser
        run: node tests/test-money-parser.js
      - name: Restore clasp credentials
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          if [ -z "$CLASPRC_JSON" ]; then
            echo "::error::Missing GitHub Actions secret CLASPRC_JSON"
            exit 1
          fi
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          chmod 600 "$HOME/.clasprc.json"
      - name: Push source to Apps Script
        run: npx --yes @google/clasp@3.4.1 push --force
      - name: Redeploy Web App
        run: npx --yes @google/clasp@3.4.1 update-deployment "AKfycbyaTgOIeeNkUEUoqsQcEaI_LPSFh8V4Rf28gxXppiTWCpxM8Eirm-wsQH_JMV9kmXyh" --description "GitHub ${GITHUB_SHA}"
      - name: Ensure Telegram webhook
        run: |
          RESPONSE="$(curl --fail --silent --show-error --location --connect-timeout 10 --max-time 45 "https://script.google.com/macros/s/AKfycbyaTgOIeeNkUEUoqsQcEaI_LPSFh8V4Rf28gxXppiTWCpxM8Eirm-wsQH_JMV9kmXyh/exec?bootstrap=1")"
          echo "$RESPONSE"
          echo "$RESPONSE" | grep -q '"ok":true'
# CI/CD source of truth: GitHub main -> Apps Script

      - name: Diagnose Telegram delivery
        run: |
          curl --fail --silent --show-error --location --connect-timeout 10 --max-time 45 'https://script.google.com/macros/s/AKfycbyaTgOIeeNkUEUoqsQcEaI_LPSFh8V4Rf28gxXppiTWCpxM8Eirm-wsQH_JMV9kmXyh/exec?diagnostic=1'
          echo
