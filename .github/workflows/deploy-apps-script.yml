name: Deploy legacy GAS Homepage endpoints (manual only)
on:
  # LEGACY GAS: Homepage stats/chat endpoints only. Active family bot deploys from experiment/gas-webhook-isolated.
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: apps-script-production
  cancel-in-progress: true
jobs:
  test-and-deploy:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Test money parser
        run: node tests/test-money-parser.js
      - name: Test reporting and Gemini features
        run: node --test tests/*.test.js
      - name: Restore clasp credentials
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          if [ -z "$CLASPRC_JSON" ]; then
            echo "::error::Missing GitHub Actions secret CLASPRC_JSON"
            exit 1
          fi
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          chmod 600 "$HOME/.clasprc.json"
      - name: Push source to Apps Script
        run: npx --yes @google/clasp@3.4.1 push --force
      - name: Redeploy Web App
        run: npx --yes @google/clasp@3.4.1 update-deployment "AKfycbyaTgOIeeNkUEUoqsQcEaI_LPSFh8V4Rf28gxXppiTWCpxM8Eirm-wsQH_JMV9kmXyh" --description "GitHub ${GITHUB_SHA}"
      # No bootstrap, polling trigger or Telegram webhook mutation. Manual deployment only.

